[project]
name = "content-engine"
version = "0.1.0"
description = "Client Content Engine — multi-tenant, provenance-tracked brand-knowledge ingestion backend"
readme = "README.md"
authors = [
    { name = "InsideSuccess.TV", email = "sd@insidesuccess.com" }
]
requires-python = ">=3.13"
# Licence ledger (docs/DECISIONS.md records reasoning; every entry checked before adding):
#   fastapi (MIT) · uvicorn (BSD-3) · sqlalchemy (MIT) · alembic (MIT)
#   pydantic / pydantic-settings (MIT) · psycopg (LGPL-3.0 — dynamic linking, unmodified: OK)
#   pgvector (MIT) · python-multipart (Apache-2.0) · httpx (BSD-3)
#   anthropic (MIT) · voyageai (MIT) · docling (MIT)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.18",
    "anthropic>=0.120.2",
    "voyageai>=0.5.0",
    "python-dotenv>=1.2.2",
    "docling>=2.117.0",
]

[dependency-groups]
# pytest (MIT) · pytest-asyncio (Apache-2.0) · httpx/httpx2 (BSD-3) · ruff (MIT)
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
