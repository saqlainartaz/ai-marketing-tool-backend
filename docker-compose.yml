services:
  db:
    # pgvector/pgvector image (PostgreSQL licence + pgvector MIT)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: content_engine
      POSTGRES_PASSWORD: content_engine_dev  # local dev only — never production
      POSTGRES_DB: content_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_engine -d content_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
