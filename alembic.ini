[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# URL comes from ADMIN_DATABASE_URL env (see migrations/env.py); this is a dev fallback.
sqlalchemy.url = postgresql+psycopg://content_engine:content_engine_dev@localhost:5432/content_engine

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
