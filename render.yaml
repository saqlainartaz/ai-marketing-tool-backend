# Render Blueprint — deploy with "New +" -> "Blueprint" pointing at this repo.
# After first deploy, complete the manual steps in docs/DEPLOY_CHECKLIST.md
# (role passwords + DATABASE_URL/WORKER_DATABASE_URL).

services:
  - type: web
    name: content-engine
    runtime: docker
    plan: starter
    healthCheckPath: /health
    # Migrations run as the admin role before each deploy goes live.
    preDeployCommand: uv run --no-dev alembic upgrade head
    disk:
      name: raw-storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: RAW_STORAGE_ROOT
        value: /var/data/raw
      - key: ENGINE_LLM_PROVIDER
        value: anthropic
      - key: ENGINE_EMBEDDING_PROVIDER
        value: voyage
      - key: ENGINE_ANTHROPIC_MODEL
        value: claude-opus-5
      # Secrets — set in the Render dashboard (sync: false = never in git):
      - key: SERVICE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Admin connection (migrations) — from the managed database:
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: content-engine-db
          property: connectionString
      # App + worker connections use the restricted roles created by migration
      # 0001/0003. Set these manually AFTER rotating the role passwords
      # (docs/DEPLOY_CHECKLIST.md step 4):
      - key: DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false

databases:
  - name: content-engine-db
    plan: basic-1gb
    postgresMajorVersion: "17"
